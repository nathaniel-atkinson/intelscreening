<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta name='viewport' content='width=device-width'/>
        <meta charset='UTF-8'/>
        

        <link rel="icon" type="image/x-icon" href="/Files/favicon/favicon.ico"/>
        <link rel="icon" type="image/png" sizes="16x16" href="/Files/favicon/favicon-16x16.png"/>
        <link rel="icon" type="image/png" sizes="32x32" href="/Files/favicon/favicon-32x32.png"/>
        <link rel="apple-touch-icon" sizes="180x180" href="/Files/favicon/apple-touch-icon.png"/>
        <link rel="icon" type="image/png" sizes="192x192" href="/Files/favicon/icon-192x192.png"/>
        <link rel="icon" type="image/png" sizes="512x512" href="/Files/favicon/icon-512x512.png"/>


        <title>Intel Screening</title>

        <link id='stylesheet' rel='stylesheet' href="/global/styles/system.css"/>
    </head>
    <body>
        <header>
            <div class="left"></div>
            <div class="middle"></div>
            <div class="right"></div>
        </header>
        <nav>
            <div class="left">
                <div id="clock">00:00:00</div>
            </div>
            <div class="middle"></div>
            <div class="right"></div>
        </nav>
        <main>
            <div class="left container">
                <div>
                    <button id="gallery" class='main'>GALLERY</button>
                    <hr>
                    <button id="test" class='main'>TEST</button>
                    <button id='create' class='main'>CREATE</button>
                    <button id='delete' class='main'>DELETE</button>
                    <button id='settings' class='main'>SETTINGS</button>
                    <hr>
                    <button id='consoleToggle' class='setting'>Console [<span>true</span>]</button>
                    <button id='lightThemeToggle' class='setting'>Theme [<span></span>]</button>
                </div>
            </div>
            <div class="middle container">
                <iframe title='frame' src=''></iframe>
            </div>
            <div class="right container">
                <div id="log"></div>
            </div>
        </main>
        <footer>
            <div class="left"></div>
            <div class="middle"></div>
            <div class="right"></div>
        </footer>

        <script type="module" src="/global/scripts/scripts.js"></script>
        <script type="module" src="/global/scripts/functions.js"></script>
        <script type="module" src="/default/scripts.js"></script>
        <script type="module" src="/global/scripts/console.js"></script>
        <script type="module" src="/global/scripts/clock.js"></script>
    </body>
</html>
